[project]
name = "nallm"
version = "2.0.0"
description = "NALLM: real-time name disambiguation with an LLM as the decision core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "openai>=2.30.0",
    "pandas>=3.0.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.17.0",
    "tqdm>=4.67.1",
    "lmdb>=2.1.1",
    "pydantic>=2.12.5",
    "deepseek-tokenizer>=0.2.0",
    "pyjarowinkler>=3.0.0",
    "unidecode>=1.4.0",
    "lightgbm>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nallm"]

[tool.hatch.build.targets.sdist]
include = ["src/nallm"]
